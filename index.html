<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KOLEKSI TERBARU 2026</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Arial', sans-serif; }
    body { background: #0a0a0a; color: #fff; padding: 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 24px; margin-bottom: 5px; }
    .header p { color: #aaa; font-size: 14px; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #1a1a1a; border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #333; position: relative; }
    .card.terbaru { border: 2px solid #ff0055; background: linear-gradient(135deg, #1a1a1a, #2a0015); }
    .badge { display: inline-block; background: #ff0055; color: #fff; padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; margin-bottom: 10px; }
    .badge.update { background: #333; }
    .tanggal { font-size: 22px; font-weight: bold; margin-bottom: 8px; }
    .info { color: #ccc; font-size: 14px; margin-bottom: 10px; }
    .link { color: #00aaff; text-decoration: none; font-weight: bold; }
    .arrow { position: absolute; top: 20px; right: 20px; color: #666; }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 KOLEKSI TERBARU 2026</h1>
    <p>Update File Terbaru Setiap Hari</p>
  </div>

  <div class="container">
    <h3>📅 Daftar File Update</h3>
    
    <div class="card terbaru">
      <span class="badge">TERBARU</span>
      <span class="arrow">↗</span>
      <div class="tanggal">08-08-2026</div>
      <div class="info">🎬 10 Video</div>
      <a href="#" class="link">➡️ Klik untuk melihat</a>
    </div>

    <div class="card">
      <span class="badge update">UPDATE</span>
      <span class="arrow">↗</span>
      <div class="tanggal">07-08-2026</div>
      <div class="info">🎬 10 Video</div>
      <a href="#" class="link">➡️ Klik untuk melihat</a>
    </div>

    <div class="card">
      <span class="badge update">UPDATE</span>
      <span class="arrow">↗</span>
      <div class="tanggal">06-08-2026</div>
      <div class="info">🎬 10 Video</div>
      <a href="#" class="link">➡️ Klik untuk melihat</a>
    </div>
    
  </div>
</body>
</html>
