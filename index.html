<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Koleksi Terbaru 2026</title>
  <style>
    body { font-family: Arial; background: white; text-align: center; padding: 20px; }
    h1 { font-size: 22px; margin: 0; }
    .update { border: 2px solid black; display: inline-block; padding: 5px 15px; margin: 10px 0 20px 0; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 400px; margin: 0 auto; }
    .box { border: 2px solid black; border-radius: 8px; padding: 25px 5px; font-size: 16px; }
  </style>
</head>
<body>
  <h1>Koleksi Terbaru 2026</h1>
  <div class="update">Update terbaru</div>
  <div class="grid">
    <div class="box">tanggal</div>
    <div class="box">tanggal</div>
    <div class="box">tanggal</div>
    <div class="box">tanggal</div>
    <div class="box">tanggal</div>
    <div class="box">tanggal</div>
  </div>
</body>
</html>
